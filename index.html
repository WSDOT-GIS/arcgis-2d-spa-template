<!doctype html>
<html lang="en-US">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="shortcut icon" href="/favicon.svg" type="text/xml+svg" />
	<!-- Load Calcite -->
	<script type="module" src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"
		integrity="sha512-X3bf+sWbgJeCC0DLiYxtY+n+fPt6V3d4X4cdxKSCzawhFXuUqJ6aXEocLGYOFSX6LlYTBVdfMebXKhmWOSdcxw=="
		crossorigin="anonymous"></script>

	<!--
		Contitionally load either the light or dark theme depending on user's settings.
		See https://blog.jim-nielsen.com/2019/conditional-syntax-highlighting-in-dark-mode-with-css-imports/
		-->
	<link media="screen and (prefers-color-scheme: light)" rel="stylesheet"
		href="https://js.arcgis.com/4.34/@arcgis/core/assets/esri/themes/light/main.css" />
	<link rel="stylesheet" media="screen and (prefers-color-scheme: dark)"
		href="https://js.arcgis.com/4.34/@arcgis/core/assets/esri/themes/dark/main.css" />

	<script src="https://js.arcgis.com/4.34/"></script>

	<!-- Load map components -->
	<script type="module" src="https://js.arcgis.com/4.34/map-components/index.js"></script>
	<title>%VITE_APP_TITLE%</title>
</head>

<!-- 
The "calcite-mode-auto" CSS class makes Calcite automatically
load dark/light theme matching user's preferred settings.
 -->

<body class="calcite-mode-auto">
	<calcite-shell>
		<calcite-shell-panel slot="header">
			<h1>%VITE_APP_TITLE%</h1>
		</calcite-shell-panel>

		<!-- This is the map. It is set to be centered on WA. -->
		<arcgis-map basemap="hybrid" center="-120.85,47.295" zoom="7">
			<!--
			Add map components.
			Small components (e.g., ones that are just single buttons) are placed
			directly on the map.
			Ones that are more complex are placed in an "arcgis-expand" component.
			-->

			<!-- Top-left -->
			<arcgis-zoom slot="top-left"></arcgis-zoom>
			<arcgis-home slot="top-left"></arcgis-home>
			<arcgis-locate slot="top-left"></arcgis-locate>
			<arcgis-expand slot="top-left" group="top-left">
				<arcgis-distance-measurement-2d unit="us-feet"></arcgis-distance-measurement-2d>
			</arcgis-expand>

			<!-- Top-right -->
			<arcgis-expand slot="top-right" group="top-right">
				<arcgis-search include-default-sources-disabled=""></arcgis-search>
			</arcgis-expand>
			<arcgis-expand slot="top-right" group="top-right">
				<arcgis-layer-list visibility-appearance="checkbox" drag-enabled
					show-temporary-layer-indicators></arcgis-layer-list>
			</arcgis-expand>
			<arcgis-expand slot="top-right" group="top-right">
				<arcgis-legend legend-style="card" card-style-layout="auto" hide-layers-not-in-current-view
					respect-layer-definition-expression basemap-legend-visible></arcgis-legend>
			</arcgis-expand>
			<arcgis-expand slot="top-right" group="top-right">
				<arcgis-basemap-gallery></arcgis-basemap-gallery>
			</arcgis-expand>

			<!-- Bottom-left -->
			<arcgis-scale-bar slot="bottom-left" unit="dual"></arcgis-scale-bar>
		</arcgis-map>
	</calcite-shell>
	<!-- Load the module with our custom code. -->
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
